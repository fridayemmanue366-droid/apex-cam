[project]
name = "apexcam-backend"
version = "0.1.0"
description = "Apex Cam AI backend — real-time face & voice transformation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Heavy AI/runtime deps are opt-in so the skeleton installs fast during early phases.
ai = [
    "torch>=2.3",
    "onnxruntime-gpu>=1.18",
    "opencv-python>=4.10",
    "insightface>=0.7",
    "mediapipe>=0.10",
]
stream = [
    "pyvirtualcam>=0.11",
    "sounddevice>=0.4",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
