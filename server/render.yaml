# Apex Cam cloud server — Render deployment blueprint.
#
# Deploy:  push this repo to GitHub -> Render -> New -> Blueprint -> pick the repo.
# Render reads this file and creates the service. Secrets marked `sync: false` are
# typed into the Render dashboard by YOU — they never live in git and are never
# shipped in the app.
#
# NOTE ON PLAN: 'starter' ($7/mo) is required because we need a PERSISTENT DISK.
# Render's free tier has an ephemeral filesystem — the database (accounts, credits,
# subscriptions) would be WIPED on every restart/redeploy. Never use free for real
# customer money.
services:
  - type: web
    name: apexcam-api
    runtime: python
    plan: starter
    region: frankfurt          # closest of Render's regions to Nigeria
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: apexcam-data       # keeps the SQLite DB across restarts/deploys
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APEXCAM_DB
        value: /data/apexcam.db          # on the persistent disk
      - key: APEXCAM_SECRET
        generateValue: true              # Render generates a strong random signing secret
      - key: APEXCAM_DECART_KEY
        sync: false                      # paste in the Render dashboard (Decart key)
      - key: FLW_SECRET
        sync: false                      # paste in the dashboard (LIVE Flutterwave secret)
      - key: APEXCAM_PUBLIC_URL
        sync: false                      # e.g. https://apexcam-api.onrender.com
      - key: APEXCAM_PAY_CURRENCY
        value: NGN
      - key: APEXCAM_NGN_PER_USD
        value: "1600"
      - key: APEXCAM_SUB_NGN
        value: "20000"                   # local app subscription: ₦20,000/month
      - key: APEXCAM_TRIAL_DAYS
        value: "1"
